# The wulin v3 Ruby policy: the floor is 3.4 (the gemspec), the default is 4.0. Tests run on both,
# each on the newest patch of its line through the floating tag; anything else runs on the default.
image: ruby:$RUBY_VERSION

variables:
  RUBY_VERSION: "4.0"

stages:
  - test

default:
  before_script:
    # wulin_master comes from git over ssh
    - apt update -qy && apt install -qy openssh-client
    - eval `ssh-agent -s`
    - ssh-add /home/gitlab-runner/.ssh/id_rsa
    - mkdir ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H gitlab.ekohe.com >> ~/.ssh/known_hosts
    - gem install bundler -v 2.5.7
    - bundle config path vendor/bundle
    - bundle check || bundle install --jobs 8

rspec:
  stage: test
  parallel:
    matrix:
      - RUBY_VERSION: ["3.4", "4.0"]
  script:
    - bundle exec rspec
  cache:
    key:
      prefix: ruby-$RUBY_VERSION
      files:
        - Gemfile.lock
    paths:
      - vendor/bundle
